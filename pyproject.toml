[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filepulse"
version = "0.2.0"
description = "Metadata-only filesystem monitoring and analytics"
requires-python = ">=3.12"
dependencies = [
  "watchdog==6.0.0",
  "pandas==2.3.3",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "psycopg[binary,pool]==3.2.10",
  "pymongo==4.15.3",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "streamlit==1.51.0",
  "plotly==6.1.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires running TimescaleDB and MongoDB"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
